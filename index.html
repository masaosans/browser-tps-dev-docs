<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎮 Browser TPS - Phase 2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      overflow: hidden; 
      touch-action: none; 
      background: #000; 
      font-family: sans-serif;
      /* ★文字選択防止（タッチ操作中のハイライト防止）★ */
      -webkit-user-select: none;  /* Safari/Chrome */
      -moz-user-select: none;     /* Firefox */
      -ms-user-select: none;      /* IE/Edge */
      user-select: none;          /* 標準 */
      -webkit-tap-highlight-color: transparent;  /* タップ時のハイライト消し */
    }
    
    /* ゲームキャンバス */
    #game-canvas { display: block; width: 100vw; height: 100vh; }
    
    /* UIオーバーレイ層 */
    #ui-layer {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
    }
    
    /* ジョイスティックゾーン（左下） */
    #joystick-zone {
      position: absolute; bottom: 20px; left: 20px;
      width: 150px; height: 150px; pointer-events: auto;
    }
    
    /* 射撃ボタン（右下 — reload/coverの上に配置） */
    #fire-btn {
      position: absolute; bottom: 150px; right: 30px;
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(255,68,68,0.8); border: 4px solid white;
      color: white; font-size: 16px; font-weight: bold;
      pointer-events: auto; cursor: pointer;
    }
    
    /* リロードボタン（右下） */
    #reload-btn {
      position: absolute; bottom: 20px; right: 30px;
      width: 55px; height: 55px; border-radius: 50%;
      background: rgba(68,136,255,0.7); border: 2px solid white;
      color: white; font-size: 11px; font-weight: bold;
      pointer-events: auto; cursor: pointer;
    }
    
    /* カバボタン（右下） */
    #cover-btn {
      position: absolute; bottom: 80px; right: 30px;
      width: 55px; height: 55px; border-radius: 50%;
      background: rgba(68,255,68,0.7); border: 2px solid white;
      color: white; font-size: 11px; font-weight: bold;
      pointer-events: auto; cursor: pointer;
    }
    
    /* HUD（上部） */
    #hud {
      position: absolute; top: 15px; left: 15px; right: 15px;
      display: flex; justify-content: space-between; align-items: center;
    }
    
    #hp-container {
      width: 200px; height: 24px; background: rgba(0,0,0,0.6);
      border: 2px solid #fff; border-radius: 4px; overflow: hidden;
    }
    
    #hp-fill {
      height: 100%; background: linear-gradient(to right, #e74c3c, #ff6b6b);
      width: 100%; transition: width 0.3s;
    }
    
    #score-display {
      color: white; font-size: 20px; font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    
    /* 弾数表示 */
    #ammo-display {
      position: absolute; bottom: 90px; right: 30px; color: white;
      font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    
    /* ヒットマーカー */
    #hit-marker {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 30px; height: 30px; opacity: 0; transition: opacity 0.1s;
    }
    
    #hit-marker::before, #hit-marker::after {
      content: ''; position: absolute; background: white;
    }
    
    #hit-marker::before {
      width: 2px; height: 30px; left: 14px; top: 0;
    }
    
    #hit-marker::after {
      width: 30px; height: 2px; top: 14px; left: 0;
    }
    
    /* スタート画面 */
    #start-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; color: white;
    }
    
    #start-screen h1 { font-size: 36px; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    #start-screen p { font-size: 16px; margin: 8px 0; opacity: 0.9; }
    
    #start-btn {
      margin-top: 30px; padding: 15px 40px; font-size: 20px; font-weight: bold;
      background: white; color: #764ba2; border: none; border-radius: 30px;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    
    /* ゲームオーバー画面 */
    #game-over-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100; color: white;
    }
    
    #game-over-screen h1 { font-size: 42px; margin-bottom: 20px; color: #e74c3c; }
    #final-score { font-size: 28px; margin: 10px 0; }
    
    #restart-btn {
      margin-top: 30px; padding: 15px 40px; font-size: 20px; font-weight: bold;
      background: #e74c3c; color: white; border: none; border-radius: 30px;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    
    /* FPS表示 */
    #fps-display {
      position: absolute; top: 50px; right: 15px; color: white;
      font-size: 12px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    
    /* ウェーブ表示 */
    #wave-display {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; font-size: 48px; font-weight: bold; opacity: 0;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8); pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- スタート画面 -->
  <div id="start-screen">
    <h1>🎮 Browser TPS</h1>
    <p>Phase 2: Shooting System + Enemies</p>
    <p style="margin-top:20px; font-size:14px;">🕹️ Left Joystick = Move | 👆 Right Swipe = Look</p>
    <p style="font-size:14px;">🔫 Fire Button = Shoot | 🔄 Reload = R</p>
    <button id="start-btn">▶ START GAME</button>
  </div>
  
  <!-- ゲームオーバー画面 -->
  <div id="game-over-screen">
    <h1>GAME OVER</h1>
    <div id="final-score">Score: 0</div>
    <p style="opacity:0.7;">Wave reached: 1</p>
    <button id="restart-btn">🔄 RESTART</button>
  </div>
  
  <!-- ゲームキャンバス -->
  <canvas id="game-canvas"></canvas>
  
  <!-- UIオーバーレイ -->
  <div id="ui-layer">
    <!-- HUD -->
    <div id="hud">
      <div id="hp-container"><div id="hp-fill"></div></div>
      <div id="score-display">Score: 0</div>
    </div>
    
    <!-- 弾数表示 -->
    <div id="ammo-display">30 / 30</div>
    
    <!-- ヒットマーカー -->
    <div id="hit-marker"></div>
    
    <!-- ウェーブ表示 -->
    <div id="wave-display"></div>
    
    <!-- FPS表示 -->
    <div id="fps-display">FPS: --</div>
    
    <!-- ジョイスティックゾーン -->
    <div id="joystick-zone"></div>
    
    <!-- ボタン類 -->
    <button id="fire-btn">🔫 FIRE</button>
    <button id="reload-btn">R</button>
    <button id="cover-btn">COVER</button>
  </div>
  
  <!-- nipplejs CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
  
  <!-- Three.js importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
  }
  </script>
  
  <!-- ゲーム本体 -->
  <script type="module">
    import * as THREE from 'three';
    
    // ============================================================
    // ゲーム状態
    // ============================================================
    const STATE = {
      playerHealth: 100, maxHealth: 100,
      score: 0, wave: 1, enemies: [],
      isPlaying: false, isGameOver: false,
    };
    
    // Spring Armパラメータ ★カメラを低くして水平視点に近づける★
    const SPRING_ARM = {
      DISTANCE: 8, HEIGHT: 1.5, LERP_FACTOR: 0.1, // ★HEIGHTを3.5→1.5に（低く！）
      MIN_PITCH: -0.2, MAX_PITCH: 0.6, ZOOM_DISTANCE: 4, // ★水平〜やや上のみ
    };
    
    let cameraYaw = 0, cameraPitch = 0.3;
    let currentZoom = SPRING_ARM.DISTANCE;
    let targetZoom = SPRING_ARM.DISTANCE;
    
    // ジョイスティック入力
    const joystickInput = { x: 0, y: 0, forward: false, back: false, left: false, right: false };
    
    // ============================================================
    // Three.jsシーン初期化（モバイル最適化）
    // ============================================================
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ 
      canvas, antialias: !isMobile, alpha: false 
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = isMobile ? THREE.BasicShadowMap : THREE.PCFSoftShadowMap;
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // 空の色（青）
    scene.fog = new THREE.Fog(0x87CEEB, 20, 100); // フォグで奥をぼかす
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    
    // ライティング
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(10, 20, 10);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 1024;
    directionalLight.shadow.mapSize.height = 1024;
    scene.add(directionalLight);
    
    // ============================================================
    // 地面と障害物
    // ============================================================
    // 地面
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ 
      color: 0x4a7c59, roughness: 0.8 
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    
    // グリッドヘルパー（視覚的補助）
    const gridHelper = new THREE.GridHelper(100, 50, 0x3a6c49, 0x3a6c49);
    scene.add(gridHelper);
    
    // 障害物（箱）
    function createObstacle(x, z, width, height, depth, color) {
      const geo = new THREE.BoxGeometry(width, height, depth);
      const mat = new THREE.MeshStandardMaterial({ color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, height / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }
    
    // いくつかの障害物を配置
    createObstacle(-10, -10, 3, 4, 3, 0x8B4513); // 茶色の箱
    createObstacle(10, -15, 2, 3, 2, 0x696969);   // グレーの箱
    createObstacle(-15, 5, 4, 2, 4, 0x8B4513);    // 大きな箱
    createObstacle(15, 10, 3, 5, 3, 0x696969);    // 高い柱
    
    // ============================================================
    // プレイヤーキャラクター ★顔付き★
    // ============================================================
    const playerGroup = new THREE.Group();
    
    // 胴体
    const bodyGeo = new THREE.CapsuleGeometry(0.4, 1.2, 4, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3498db });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.2;
    body.castShadow = true;
    playerGroup.add(body);
    
    // 頭
    const headGeo = new THREE.SphereGeometry(0.3, 8, 8);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.1;
    head.castShadow = true;
    playerGroup.add(head);
    
    // ★顔（前面に目をつけて方向を分かりやすく）★
    // 左目
    const eyeGeo = new THREE.SphereGeometry(0.06, 8, 8);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.12, 2.15, 0.25); // 前面に配置
    playerGroup.add(leftEye);
    
    // 右目
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.12, 2.15, 0.25);
    playerGroup.add(rightEye);
    
    // 武器（右手に保持）
    const gunGeo = new THREE.BoxGeometry(0.15, 0.15, 0.6);
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const gun = new THREE.Mesh(gunGeo, gunMat);
    gun.position.set(0.5, 1.4, -0.3);
    playerGroup.add(gun);
    
    scene.add(playerGroup);
    
    // ============================================================
    // Spring Armカメラ
    // ============================================================
    function updateCamera(delta) {
      // ズームの滑らかな遷移
      currentZoom += (targetZoom - currentZoom) * 0.1;
      
      // カメラ目標位置を計算（球座標→直交座標）
      const spherical = new THREE.Spherical(currentZoom, cameraPitch, cameraYaw);
      const camOffset = new THREE.Vector3().setFromSpherical(spherical);
      const targetPos = playerGroup.position.clone().add(camOffset);
      
      // Raycastによる衝突回避（簡易版）
      const raycaster = new THREE.Raycaster(
        targetPos.clone(),
        playerGroup.position.clone().sub(targetPos).normalize(),
        0, currentZoom
      );
      
      const intersects = raycaster.intersectObjects(scene.children, true);
      let finalCamPos = targetPos;
      
      for (const hit of intersects) {
        if (hit.distance < currentZoom && hit.point.y > playerGroup.position.y) {
          finalCamPos = raycaster.ray.at(hit.distance - 0.5, new THREE.Vector3());
          break;
        }
      }
      
      // lerpで滑らかに追従
      camera.position.lerp(finalCamPos, SPRING_ARM.LERP_FACTOR);
      camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0)));
    }
    
    // ============================================================
    // プレイヤー移動（カメラ基準の相対移動）★滑らかな回転★
    // ============================================================
    let playerRotationTarget = 0; // ターゲットの回転角
    const ROTATION_SPEED = 8;     // 回転速度
    
    function updatePlayer(delta) {
      const speed = 6;
      
      // カメラの前方ベクトルを取得（Y成分を0＝水平面のみ）
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();
      
      // 右ベクトル（前方×上）
      const right = new THREE.Vector3();
      right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
      
      // ジョイスティック入力から移動方向を計算
      const moveDir = new THREE.Vector3();
      if (joystickInput.forward) moveDir.add(forward);
      if (joystickInput.back) moveDir.sub(forward);
      if (joystickInput.right) moveDir.add(right);
      if (joystickInput.left) moveDir.sub(right);
      
      if (moveDir.length() > 0) {
        moveDir.normalize();
        playerGroup.position.addScaledVector(moveDir, speed * delta);
        
        // ★滑らかに回転（即座に向かない）★
        const targetAngle = Math.atan2(moveDir.x, moveDir.z);
        let angleDiff = targetAngle - playerRotationTarget;
        
        // 最短経路に補正（±π以内）
        if (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        if (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        
        playerRotationTarget += angleDiff * ROTATION_SPEED * delta;
        playerGroup.rotation.y = playerRotationTarget;
      }
      
      // 地面衝突（簡易: y=0固定）
      playerGroup.position.y = 0;
    }
    
    // ============================================================
    // nipplejsジョイスティック統合
    // ============================================================
    const joystickManager = nipplejs.create({
      zone: document.getElementById('joystick-zone'),
      mode: 'static',
      position: { left: '50%', top: '50%' },
      color: 'white', size: 120,
    });
    
    joystickManager.on('move', (evt, data) => {
      if (!data?.vector) return;
      const threshold = 0.3;
      joystickInput.x = data.vector.x;
      joystickInput.y = data.vector.y;
      joystickInput.forward = data.vector.y > threshold;
      joystickInput.back = data.vector.y < -threshold;
      joystickInput.right = data.vector.x > threshold;
      joystickInput.left = data.vector.x < -threshold;
    });
    
    joystickManager.on('end', () => {
      Object.assign(joystickInput, { x:0, y:0, forward:false, back:false, left:false, right:false });
    });
    
    // ============================================================
    // カメラ回転（右側スワイプ）
    // ============================================================
    const TOUCH_SENSITIVITY = 0.005;
    let lastTouchX = 0, lastTouchY = 0;
    
    canvas.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      if (touch.clientX > window.innerWidth / 2) {
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
      }
    }, { passive: true });
    
    canvas.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      if (touch.clientX > window.innerWidth / 2) {
        const dx = touch.clientX - lastTouchX;
        const dy = touch.clientY - lastTouchY;
        
        // Three.js球座標系ではスワイプ方向と逆符号が必要
        cameraYaw -= dx * TOUCH_SENSITIVITY;
        cameraPitch = Math.max(SPRING_ARM.MIN_PITCH, 
                  Math.min(SPRING_ARM.MAX_PITCH, cameraPitch - dy * TOUCH_SENSITIVITY));
        
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
      }
    }, { passive: true });
    
    // ============================================================
    // Phase 2: 射撃システム ★NEW!
    // ============================================================
    const WEAPON = {
      AMMO_MAX: 30,
      AMMO_CURRENT: 30,
      FIRE_RATE: 0.15,       // 連射間隔（秒）
      RECOIL_AMOUNT: 0.05,   // リコイル量
      RECOVERY_SPEED: 2.0,   // リコイル回復速度
      RELOAD_TIME: 2.0,      // リロード時間
    };
    
    let lastFireTime = 0;
    let recoilOffset = 0;
    let isReloading = false;
    let reloadTimer = null;
    
    // ヒットエフェクト用パーティクル配列
    const hitEffects = [];
    const muzzleFlashes = [];
    const tracers = [];
    
    function shoot() {
      if (isReloading || WEAPON.AMMO_CURRENT <= 0) return;
      
      const now = performance.now() / 1000;
      if (now - lastFireTime < WEAPON.FIRE_RATE) return;
      lastFireTime = now;
      
      WEAPON.AMMO_CURRENT--;
      updateAmmoDisplay();
      
      // ★カメラの真正面から発射（地表と平行 + 遠距離用少し下向き）★
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);  // カメラの前方ベクトル
      
      // ★遠くの敵にも当たるよう、弾の高さを敵の中心質量（y≈0.5）に合わせる★
      // カメラが上を向いていても、地表とほぼ平行＋少し下向きにする
      forward.y = -0.08;  // 約4.6度下向き → 遠距離でも敵の胴体に当たる！
      forward.normalize();
      
      // 武器の位置から発射（y≈1.4m）
      const gunWorldPos = new THREE.Vector3();
      gun.getWorldPosition(gunWorldPos);
      
      // ★Raycaster: near=0.5, far=100 で近い障害物・遠距離を最適化★
      const raycaster = new THREE.Raycaster(gunWorldPos, forward, 0.5, 100);
      
      // 敵との交差チェック
      const enemyMeshes = STATE.enemies.map(e => e.mesh);
      const intersects = raycaster.intersectObjects(enemyMeshes, true);
      
      if (intersects.length > 0 && intersects[0].distance < 100) {
        // 命中！敵のHPを減少
        const hitObject = intersects[0].object;
        let enemy = STATE.enemies.find(e => e.mesh === hitObject || e.mesh.children.includes(hitObject));
        if (enemy) {
          enemy.takeDamage(25);
          createHitEffect(intersects[0].point);
          
          // ヒットマーカー表示
          showHitMarker();
        }
      }
      
      // リコイル（カメラを上にずらす）
      recoilOffset += WEAPON.RECOIL_AMOUNT;
      
      // マズルフラッシュ
      createMuzzleFlash(gunWorldPos, forward);
      
      // プロジェクトイルの視覚エフェクト（簡易線）
      const target = intersects.length > 0 ? intersects[0].point : gunWorldPos.clone().add(forward.multiplyScalar(50));
      createTracer(gunWorldPos, target);
    }
    
    function createHitEffect(position) {
      // 命中位置にパーティクルを生成
      const particleCount = 8;
      const positions = new Float32Array(particleCount * 3);
      const velocities = [];
      
      for (let i = 0; i < particleCount; i++) {
        positions[i*3] = position.x;
        positions[i*3+1] = position.y;
        positions[i*3+2] = position.z;
        
        // ランダムな方向に飛散
        velocities.push(new THREE.Vector3(
          (Math.random() - 0.5) * 4,
          Math.random() * 4,
          (Math.random() - 0.5) * 4
        ));
      }
      
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      
      const mat = new THREE.PointsMaterial({ 
        size: 0.2, 
        color: 0xffaa44,
        transparent: true,
        opacity: 1
      });
      const particles = new THREE.Points(geo, mat);
      scene.add(particles);
      
      // パーティクルとして管理
      hitEffects.push({
        mesh: particles,
        velocities: velocities,
        life: 0.3, // 秒
        maxLife: 0.3
      });
    }
    
    function createMuzzleFlash(position, direction) {
      const flash = new THREE.PointLight(0xffaa44, 10, 8);
      flash.position.copy(position);
      if (direction) {
        flash.position.addScaledVector(direction, -1);
      }
      scene.add(flash);
      
      muzzleFlashes.push({
        light: flash,
        life: 0.05 // 0.05秒で消える
      });
    }
    
    function createTracer(startPos, target) {
      // 武器位置から命中点へ線を描画（太く明るいトレーサー）
      const points = [startPos.clone(), target];
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      
      // 太い線 + 明るい黄色 + 光るエフェクト
      const mat = new THREE.LineBasicMaterial({ 
        color: 0xffff00,       // より明るい黄色
        linewidth: 3,           // 線の太さ（ブラウザ依存）
        transparent: true, 
        opacity: 1.0            // 最初は完全不透明
      });
      const line = new THREE.Line(geo, mat);
      
      // 追加: 中心に白いコア線（視認性向上）
      const coreGeo = new THREE.BufferGeometry().setFromPoints(points);
      const coreMat = new THREE.LineBasicMaterial({ 
        color: 0xffffff, 
        transparent: true, 
        opacity: 0.8 
      });
      const coreLine = new THREE.Line(coreGeo, coreMat);
      
      scene.add(line);
      scene.add(coreLine);
      
      tracers.push({
        line: line,
        coreLine: coreLine,  // コア線も管理
        life: 0.15,           // 0.15秒で消える（少し長く）
        maxLife: 0.15
      });
    }
    
    function showHitMarker() {
      const hitMarker = document.getElementById('hit-marker');
      hitMarker.style.opacity = '1';
      setTimeout(() => {
        hitMarker.style.opacity = '0';
      }, 100);
    }
    
    function reload() {
      if (isReloading || WEAPON.AMMO_CURRENT === WEAPON.AMMO_MAX) return;
      isReloading = true;
      
      // リロード中、HUDにアニメーション表示
      const ammoDisplay = document.getElementById('ammo-display');
      ammoDisplay.textContent = 'RELOADING...';
      ammoDisplay.style.color = '#ffaa00';
      
      setTimeout(() => {
        WEAPON.AMMO_CURRENT = WEAPON.AMMO_MAX;
        isReloading = false;
        updateAmmoDisplay();
      }, WEAPON.RELOAD_TIME * 1000);
    }
    
    function updateRecoil(delta) {
      if (recoilOffset > 0) {
        recoilOffset -= WEAPON.RECOVERY_SPEED * delta;
        if (recoilOffset < 0) recoilOffset = 0;
      }
      
      // ★リコイルを視覚効果としてカメラpositionに適用（pitchに加算しない）★
      // cameraPitch += recoilOffset; // ← これだと毎フレームカメラの向きが変わっちゃう！
    }
    
    function updateAmmoDisplay() {
      const ammoDisplay = document.getElementById('ammo-display');
      if (!isReloading) {
        ammoDisplay.textContent = `${WEAPON.AMMO_CURRENT} / ${WEAPON.AMMO_MAX}`;
        ammoDisplay.style.color = WEAPON.AMMO_CURRENT <= 5 ? '#ff4444' : 'white';
      }
    }
    
    // ============================================================
    // Phase 2: 敵AIシステム ★NEW!
    // ============================================================
    class Enemy {
      constructor(pos, type='basic') {
        this.health = type==='basic' ? 50 : 100;
        this.maxHealth = this.health;
        this.speed = type==='basic' ? 3 : 5;
        this.damage = type==='basic' ? 10 : 20;
        this.detectionRange = 20; 
        this.attackRange = 3;
        
        const color = type==='basic' ? 0xe74c3c : 0x9b59b6;
        const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1.2,4,8),
          new THREE.MeshStandardMaterial({ color }));
        m.position.copy(pos); 
        scene.add(m); 
        this.mesh = m;
        this.state = 'patrol'; 
        this.attackCooldown = 0;
        
        // ★顔（前面に目をつけて方向を分かりやすく）★
        const eyeGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 }); // 敵は赤い目
        
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.12, 1.35, 0.4); // CapsuleGeometryの前面
        m.add(leftEye);
        
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.12, 1.35, 0.4);
        m.add(rightEye);
        
        // HPバー（簡易版）
        const hpBarGeo = new THREE.PlaneGeometry(1, 0.1);
        const hpBarMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide });
        this.hpBar = new THREE.Mesh(hpBarGeo, hpBarMat);
        this.hpBar.position.y = 2.5;
        m.add(this.hpBar);
      }
      
      canSeePlayer() {
        const d = this.mesh.position.distanceTo(playerGroup.position);
        if (d > this.detectionRange) return false;
        const toP = new THREE.Vector3().subVectors(playerGroup.position, this.mesh.position).normalize();
        const fwd = new THREE.Vector3(); 
        this.mesh.getWorldDirection(fwd); 
        fwd.y=0; 
        fwd.normalize();
        return fwd.dot(toP) > 0.5;
      }
      
      update(delta) {
        this.attackCooldown -= delta;
        const d = this.mesh.position.distanceTo(playerGroup.position);
        
        // HPバーの更新
        if (this.hpBar) {
          const hpRatio = Math.max(0, this.health / this.maxHealth);
          this.hpBar.scale.x = hpRatio;
          this.hpBar.material.color.setHex(hpRatio > 0.5 ? 0x00ff00 : hpRatio > 0.25 ? 0xffff00 : 0xff0000);
        }
        
        if (this.state === 'patrol' && this.canSeePlayer()) {
          this.state = 'chase';
        } else if (this.state === 'chase') {
          if (!this.canSeePlayer() && d > this.detectionRange*1.5) {
            this.state = 'patrol';
          } else if (d <= this.attackRange) {
            this.state = 'attack';
          } else {
            const dir = new THREE.Vector3().subVectors(playerGroup.position, this.mesh.position).normalize();
            dir.y=0; 
            this.mesh.position.addScaledVector(dir, this.speed*delta);
            this.mesh.lookAt(new THREE.Vector3(playerGroup.position.x, 0, playerGroup.position.z));
          }
        } else if (this.state === 'attack') {
          if (d > this.attackRange*1.5) {
            this.state = 'chase';
          } else if (this.attackCooldown <= 0) {
            STATE.playerHealth -= this.damage;
            updateHPBar();
            this.attackCooldown = 1.5;
            
            // プレイヤーが倒されたらゲームオーバー
            if (STATE.playerHealth <= 0) {
              gameOver();
            }
          }
        }
        
        this.mesh.position.y = 0;
      }
      
      takeDamage(amount) {
        this.health -= amount;
        this.mesh.material.emissive.setHex(0xffffff);
        setTimeout(() => this.mesh.material.emissive.setHex(0x000000), 100);
        
        if (this.health <= 0) {
          scene.remove(this.mesh);
          const i = STATE.enemies.indexOf(this); 
          if(i>-1) STATE.enemies.splice(i,1);
          STATE.score += 100;
          updateScoreDisplay();
          
          // 次のウェーブを生成（簡易版）
          spawnWave(STATE.wave + 1);
        }
      }
    }
    
    function spawnWave(waveNum) {
      STATE.wave = waveNum;
      
      // ウェーブ表示
      const waveDisplay = document.getElementById('wave-display');
      waveDisplay.textContent = `WAVE ${waveNum}`;
      waveDisplay.style.opacity = '1';
      setTimeout(() => {
        waveDisplay.style.opacity = '0';
      }, 2000);
      
      // 敵を生成（ウェーブ数に応じて増加）
      const enemyCount = Math.min(waveNum + 2, 8);
      for (let i = 0; i < enemyCount; i++) {
        const angle = (i / enemyCount) * Math.PI * 2;
        const distance = 15 + Math.random() * 10;
        const x = Math.cos(angle) * distance;
        const z = Math.sin(angle) * distance;
        
        const type = waveNum >= 3 && Math.random() > 0.7 ? 'strong' : 'basic';
        const enemy = new Enemy(new THREE.Vector3(x, 0, z), type);
        STATE.enemies.push(enemy);
      }
    }
    
    function updateHPBar() {
      const hpFill = document.getElementById('hp-fill');
      const healthRatio = Math.max(0, STATE.playerHealth / STATE.maxHealth);
      hpFill.style.width = (healthRatio * 100) + '%';
      
      // HPが低い場合は赤く点滅
      if (healthRatio < 0.3) {
        hpFill.style.background = '#ff0000';
      } else {
        hpFill.style.background = 'linear-gradient(to right, #e74c3c, #ff6b6b)';
      }
    }
    
    function updateScoreDisplay() {
      document.getElementById('score-display').textContent = `Score: ${STATE.score}`;
    }
    
    // ============================================================
    // ボタン操作（Pointer Events）
    // ============================================================
    let isFiring = false;
    
    const fireBtn = document.getElementById('fire-btn');
    fireBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isFiring = true;
      shoot();
    }, { passive: false });
    
    fireBtn.addEventListener('pointerup', (e) => {
      isFiring = false;
    });
    
    // 連射（マウスホールド時）
    setInterval(() => {
      if (isFiring && STATE.isPlaying && !STATE.isGameOver) {
        shoot();
      }
    }, 100);
    
    document.getElementById('reload-btn').addEventListener('click', () => {
      reload();
    });
    
    // ============================================================
    // レスポンシブ対応
    // ============================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // ============================================================
    // FPSモニター
    // ============================================================
    let frameCount = 0, lastTime = performance.now();
    const fpsDisplay = document.getElementById('fps-display');
    
    function checkFPS() {
      const now = performance.now();
      frameCount++;
      if (now - lastTime >= 1000) {
        fpsDisplay.textContent = `FPS: ${frameCount}`;
        frameCount = 0;
        lastTime = now;
      }
    }
    
    // ============================================================
    // ゲームループ
    // ============================================================
    const clock = new THREE.Clock();
    
    function gameLoop() {
      if (!STATE.isPlaying || STATE.isGameOver) return;
      
      const delta = Math.min(clock.getDelta(), 0.1); // 最大0.1秒
      
      updatePlayer(delta);
      updateCamera(delta);
      updateRecoil(delta);
      
      // 敵の更新
      for (const enemy of STATE.enemies) {
        enemy.update(delta);
      }
      
      // ヒットエフェクトの更新
      for (let i = hitEffects.length - 1; i >= 0; i--) {
        const effect = hitEffects[i];
        effect.life -= delta;
        
        if (effect.life <= 0) {
          scene.remove(effect.mesh);
          hitEffects.splice(i, 1);
          continue;
        }
        
        // パーティクルの移動
        const positions = effect.mesh.geometry.attributes.position.array;
        for (let j = 0; j < effect.velocities.length; j++) {
          positions[j*3] += effect.velocities[j].x * delta;
          positions[j*3+1] += effect.velocities[j].y * delta;
          positions[j*3+2] += effect.velocities[j].z * delta;
          
          // 重力
          effect.velocities[j].y -= 9.8 * delta;
        }
        effect.mesh.geometry.attributes.position.needsUpdate = true;
        
        // フェードアウト
        effect.mesh.material.opacity = effect.life / effect.maxLife;
      }
      
      // マズルフラッシュの更新
      for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
        const flash = muzzleFlashes[i];
        flash.life -= delta;
        
        if (flash.life <= 0) {
          scene.remove(flash.light);
          muzzleFlashes.splice(i, 1);
        } else {
          // 点滅エフェクト
          flash.light.intensity = flash.life / 0.05 * 10;
        }
      }
      
      // トレーサーの更新（外側黄色線 + 内側白色コア）
      for (let i = tracers.length - 1; i >= 0; i--) {
        const tracer = tracers[i];
        tracer.life -= delta;
        
        if (tracer.life <= 0) {
          scene.remove(tracer.line);
          scene.remove(tracer.coreLine);
          tracers.splice(i, 1);
        } else {
          // フェードアウト（外側線）
          tracer.line.material.opacity = tracer.life / tracer.maxLife;
          // コア線も少し長く残す
          tracer.coreLine.material.opacity = (tracer.life / tracer.maxLife) * 0.8;
        }
      }
      
      checkFPS();
      
      renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }
    
    // ============================================================
    // スタート/リスタート処理
    // ============================================================
    function startGame() {
      STATE.isPlaying = true;
      STATE.isGameOver = false;
      STATE.playerHealth = 100;
      STATE.score = 0;
      STATE.wave = 1;
      STATE.enemies = [];
      
      WEAPON.AMMO_CURRENT = WEAPON.AMMO_MAX;
      isReloading = false;
      
      playerGroup.position.set(0, 0, 0);
      cameraYaw = 0;
      cameraPitch = 0.3;
      
      // 既存の敵を削除
      for (const enemy of STATE.enemies) {
        scene.remove(enemy.mesh);
      }
      
      updateHPBar();
      updateScoreDisplay();
      updateAmmoDisplay();
      
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
      
      clock.start();
      
      // 最初のウェーブを生成
      spawnWave(1);
      
      gameLoop();
    }
    
    function gameOver() {
      STATE.isGameOver = true;
      document.getElementById('final-score').textContent = `Score: ${STATE.score}`;
      document.getElementById('game-over-screen').style.display = 'flex';
    }
    
    // ボタンイベント
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);
    
    console.log('✅ Browser TPS Phase 2 loaded!');
    console.log('🕹️ Left Joystick = Move | 👆 Right Swipe = Look');
    console.log('🔫 Fire Button = Shoot | 🔄 Reload = R');
    console.log('⚔️ Enemies: Wave system active!');
  </script>
</body>
</html>

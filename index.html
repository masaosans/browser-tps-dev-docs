<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎮 Browser TPS - Phase 4 Enhanced</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      overflow: hidden; touch-action: none; background: #000; font-family: sans-serif;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game-canvas { display: block; width: 100vw; height: 100vh; }
    #ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; pointer-events: auto; }
    #fire-btn { position: absolute; bottom: 130px; right: 180px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,68,68,0.8); border: 4px solid white; color: white; font-size: 18px; font-weight: bold; pointer-events: auto; cursor: pointer; }
    #reload-btn { position: absolute; bottom: 20px; right: 30px; width: 55px; height: 55px; border-radius: 50%; background: rgba(68,136,255,0.7); border: 2px solid white; color: white; font-size: 11px; font-weight: bold; pointer-events: auto; cursor: pointer; }
    #cover-btn { position: absolute; bottom: 80px; right: 30px; width: 55px; height: 55px; border-radius: 50%; background: rgba(68,255,68,0.7); border: 2px solid white; color: white; font-size: 11px; font-weight: bold; pointer-events: auto; cursor: pointer; }
    #hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; }
    #hp-container { width: 200px; height: 24px; background: rgba(0,0,0,0.6); border: 2px solid #fff; border-radius: 4px; overflow: hidden; }
    #hp-fill { height: 100%; background: linear-gradient(to right, #e74c3c, #ff6b6b); width: 100%; transition: width 0.3s; }
    #score-display { color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    #ammo-display { position: absolute; bottom: 90px; right: 30px; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    #hit-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; opacity: 0; transition: opacity 0.1s; }
    #hit-marker::before, #hit-marker::after { content: ''; position: absolute; background: white; }
    #hit-marker::before { width: 2px; height: 30px; left: 14px; top: 0; }
    #hit-marker::after { width: 30px; height: 2px; top: 14px; left: 0; }
    #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
    #start-screen h1 { font-size: 36px; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    .controls-panel { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; margin: 15px 0; max-width: 300px; text-align: left; }
    .controls-panel h3 { font-size: 14px; margin-bottom: 10px; opacity: 0.8; }
    .controls-panel p { font-size: 12px; margin: 5px 0; opacity: 0.9; }
    #start-btn { margin-top: 30px; padding: 15px 40px; font-size: 20px; font-weight: bold; background: white; color: #764ba2; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    #game-over-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
    #game-over-screen h1 { font-size: 42px; margin-bottom: 20px; color: #e74c3c; }
    .scoreboard { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 20px; margin: 15px 0; min-width: 250px; text-align: center; }
    .scoreboard h3 { font-size: 18px; margin-bottom: 15px; opacity: 0.8; }
    .scoreboard p { font-size: 16px; margin: 8px 0; }
    .scoreboard .highlight { color: #f1c40f; font-weight: bold; font-size: 24px; }
    #restart-btn { margin-top: 30px; padding: 15px 40px; font-size: 20px; font-weight: bold; background: #e74c3c; color: white; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    #fps-display { position: absolute; top: 50px; right: 15px; color: white; font-size: 12px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
    #wave-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 48px; font-weight: bold; opacity: 0; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); pointer-events: none; }
  </style>
</head>
<body>
  <div id="start-screen">
    <h1>🎮 Browser TPS Enhanced</h1>
    <p>Phase 4: Terrain + PBR Characters + Monsters</p>
    <div class="controls-panel">
      <h3>🕹️ Controls</h3>
      <p>👈 Left Joystick = Move</p>
      <p>👆 Right Swipe = Look Around</p>
      <p>🔫 FIRE Button = Shoot (Hold for Auto-fire)</p>
      <p>🔄 R Button = Reload</p>
    </div>
    <button id="start-btn">▶ START GAME</button>
  </div>
  
  <div id="game-over-screen">
    <h1>GAME OVER</h1>
    <div class="scoreboard">
      <h3>📊 Final Score</h3>
      <p class="highlight" id="final-score">Score: 0</p>
      <p>Wave Reached: <span id="final-wave">1</span></p>
      <p>Enemies Defeated: <span id="enemies-defeated">0</span></p>
    </div>
    <button id="restart-btn">🔄 RESTART</button>
  </div>
  
  <canvas id="game-canvas"></canvas>
  
  <div id="ui-layer">
    <div id="hud"><div id="hp-container"><div id="hp-fill"></div></div><div id="score-display">Score: 0</div></div>
    <div id="ammo-display">30 / 30</div>
    <div id="hit-marker"></div>
    <div id="wave-display"></div>
    <div id="fps-display">FPS: --</div>
    <div id="joystick-zone"></div>
    <button id="fire-btn">🔫 FIRE</button>
    <button id="reload-btn">R</button>
    <button id="cover-btn">COVER</button>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/" } }
  </script>
  
  <script type="module">
    import * as THREE from 'three';

    // ============================================================
    // ゲーム状態
    // ============================================================
    const STATE = { playerHealth: 100, maxHealth: 100, score: 0, wave: 1, enemies: [], isPlaying: false, isGameOver: false };
    
    const SPRING_ARM = { DISTANCE: 8, HEIGHT: 2.0, LERP_FACTOR: 0.1, MIN_PITCH: 0, MAX_PITCH: 0.6 };
    let cameraYaw = 0, cameraPitch = 0;
    let currentZoom = SPRING_ARM.DISTANCE, targetZoom = SPRING_ARM.DISTANCE;
    
    // ★射撃状態管理★
    const SHOOT_STATE = { isAiming: false, aimBlend: 0, aimSpeed: 8.0 }; // aimBlend: 0=hipfire, 1=ADS
    
    const joystickInput = { x: 0, y: 0, forward: false, back: false, left: false, right: false };

    // ============================================================
    // Three.jsシーン初期化
    // ============================================================
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = isMobile ? THREE.BasicShadowMap : THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.FogExp2(0x87CEEB, 0.008); // より自然なフォグ

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);

    // ★PBRライティング強化★
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    
    const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x4a7c59, 0.6); // 空と地面の色
    scene.add(hemiLight);

    const directionalLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
    directionalLight.position.set(30, 50, 20);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    directionalLight.shadow.camera.near = 0.5;
    directionalLight.shadow.camera.far = 150;
    directionalLight.shadow.camera.left = -60;
    directionalLight.shadow.camera.right = 60;
    directionalLight.shadow.camera.top = 60;
    directionalLight.shadow.camera.bottom = -60;
    scene.add(directionalLight);

    // ============================================================
    // ★地形生成（Perlin Noise風）★
    // ============================================================
    const TERRAIN_SIZE = 200;
    const TERRAIN_SEGMENTS = 80;
    const MAX_HEIGHT = 4;
    
    function getTerrainHeight(x, z) {
      const n1 = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 0.5;
      const n2 = Math.sin(x * 0.15 + 1.3) * Math.cos(z * 0.12 + 0.7) * 0.25;
      const n3 = Math.sin(x * 0.3 + z * 0.2) * 0.1;
      return (n1 + n2 + n3) * MAX_HEIGHT;
    }

    function createTerrain() {
      const geo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGMENTS, TERRAIN_SEGMENTS);
      geo.rotateX(-Math.PI / 2);
      
      const positions = geo.attributes.position;
      const colors = [];
      
      for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i);
        const z = positions.getZ(i);
        const y = getTerrainHeight(x, z);
        positions.setY(i, y);
        
        // Biome Coloring（高さベース）
        let color;
        if (y < -1.5) {
          color = new THREE.Color(0x4682B4); // 水（青）
        } else if (y < 0) {
          color = new THREE.Color(0xD2B48C); // 砂（ベージュ）
        } else if (y < 1.5) {
          color = new THREE.Color(0x4a7c59); // 草（緑）
        } else if (y < 3) {
          color = new THREE.Color(0x8B4513); // 岩（茶）
        } else {
          color = new THREE.Color(0xFFFFFF); // 雪（白）
        }
        colors.push(color.r, color.g, color.b);
      }
      
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      
      const mat = new THREE.MeshStandardMaterial({ 
        vertexColors: true, roughness: 0.9, metalness: 0.1 
      });
      
      const terrain = new THREE.Mesh(geo, mat);
      terrain.receiveShadow = true;
      scene.add(terrain);
      return terrain;
    }

    const terrainMesh = createTerrain();

    // ============================================================
    // ★草フィールド（InstancedMesh）★
    // ============================================================
    function createGrassField() {
      const count = 3000;
      const grassGeo = new THREE.PlaneGeometry(0.15, 0.6);
      grassGeo.translate(0, 0.3, 0);
      
      const grassMat = new THREE.MeshStandardMaterial({ 
        color: 0x4a7c59, roughness: 0.8, side: THREE.DoubleSide 
      });
      
      const instancedMesh = new THREE.InstancedMesh(grassGeo, grassMat, count);
      const matrix = new THREE.Matrix4();
      let idx = 0;
      
      for (let i = 0; i < count && idx < count; i++) {
        const x = (Math.random() - 0.5) * TERRAIN_SIZE * 0.8;
        const z = (Math.random() - 0.5) * TERRAIN_SIZE * 0.8;
        const y = getTerrainHeight(x, z);
        
        if (y > 1.5) continue; // 高い場所はスキップ
        
        matrix.setPosition(x, y, z);
        const rot = new THREE.Euler(0, Math.random() * Math.PI * 2, (Math.random() - 0.5) * 0.3);
        matrix.makeRotationFromEuler(rot);
        instancedMesh.setMatrixAt(idx++, matrix);
      }
      
      instancedMesh.count = idx;
      scene.add(instancedMesh);
    }

    createGrassField();

    // ============================================================
    // ★障害物管理配列（衝突判定用）★
    // ============================================================
    const obstacles = [];

    // ============================================================
    // ★岩（PBR）★
    // ============================================================
    function createRock(x, z) {
      const size = 0.5 + Math.random() * 1.5;
      
      // ★セグメント数を増やして滑らかに（3→4）★
      const geo = new THREE.IcosahedronGeometry(size, 4);
      
      // ★Perlin Noise風の変形でリアルな形状に★
      const positions = geo.attributes.position;
      for (let i = 0; i < positions.count; i++) {
        const px = positions.getX(i), py = positions.getY(i), pz = positions.getZ(i);
        
        // 3層のノイズを合成（Fractal Noise）
        const n1 = Math.sin(px * 2.5 + pz * 1.7) * Math.cos(py * 2.0) * 0.15;
        const n2 = Math.sin(px * 5.0 - py * 3.0) * Math.cos(pz * 4.0) * 0.08;
        const n3 = Math.sin(px * 10.0 + pz * 8.0) * Math.cos(py * 9.0) * 0.04;
        
        // 半径方向に変形（球を押しつぶす）
        const displacement = (n1 + n2 + n3) * size;
        const length = Math.sqrt(px*px + py*py + pz*pz);
        if (length > 0) {
          positions.setXYZ(i, 
            px + (px/length) * displacement,
            py + (py/length) * displacement * 0.7, // Y軸は少し潰す
            pz + (pz/length) * displacement
          );
        }
      }
      geo.computeVertexNormals();
      
      const mat = new THREE.MeshStandardMaterial({ 
        color: 0x8B4513, roughness: 0.9, metalness: 0.1 
      });
      
      const rock = new THREE.Mesh(geo, mat);
      const y = getTerrainHeight(x, z);
      rock.position.set(x, y + size*0.2, z); // 地面に半分埋まるように
      rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
      rock.castShadow = true;
      rock.receiveShadow = true;
      scene.add(rock);
      
      // ★衝突判定用★
      rock.collisionRadius = size;
      obstacles.push(rock);
    }

    for (let i = 0; i < 30; i++) {
      createRock((Math.random()-0.5)*100, (Math.random()-0.5)*100);
    }

    // ============================================================
    // ★建物（PBR）★
    // ============================================================
    function createBuilding(x, z) {
      const building = new THREE.Group();
      
      // ★傾斜対応: 4隅の高さを取得して平均値をベースに★
      const halfSize = 3; // 建物の半分の幅（6x6なので）
      const corners = [
        getTerrainHeight(x - halfSize, z - halfSize),
        getTerrainHeight(x + halfSize, z - halfSize),
        getTerrainHeight(x - halfSize, z + halfSize),
        getTerrainHeight(x + halfSize, z + halfSize),
      ];
      const avgY = (corners[0] + corners[1] + corners[2] + corners[3]) / 4;
      
      // 本体
      const bodyGeo = new THREE.BoxGeometry(6, 8, 6);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xF5F5DC, roughness: 0.7, metalness: 0.1 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 4;
      body.castShadow = true;
      building.add(body);
      
      // 窓（ガラス）
      for (let i = -2; i <= 2; i += 2) {
        const winGeo = new THREE.PlaneGeometry(1, 1.5);
        const winMat = new THREE.MeshStandardMaterial({ color: 0x87CEEB, roughness: 0.1, metalness: 0.9 });
        
        const leftWin = new THREE.Mesh(winGeo, winMat);
        leftWin.position.set(-3.05, i + 4, 0);
        leftWin.rotation.y = -Math.PI/2;
        building.add(leftWin);
        
        const rightWin = new THREE.Mesh(winGeo, winMat);
        rightWin.position.set(3.05, i + 4, 0);
        rightWin.rotation.y = Math.PI/2;
        building.add(rightWin);
      }
      
      // ドア（木製）
      const doorGeo = new THREE.PlaneGeometry(1.5, 2.5);
      const doorMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.6, metalness: 0.2 });
      const door = new THREE.Mesh(doorGeo, doorMat);
      door.position.set(0, 1.25, 3.05);
      building.add(door);
      
      // ポイントライト（窓）
      const pointLight = new THREE.PointLight(0xffaa44, 0.8, 15);
      pointLight.position.set(0, 4, 4);
      building.add(pointLight);
      
      building.position.set(x, avgY, z); // ★傾斜対応済み★
      scene.add(building);
      
      // ★衝突判定用★
      building.halfWidth = halfSize; // AABBの半分の幅（X/Z方向）
      obstacles.push(building);
    }

    createBuilding(-20, -20);
    createBuilding(25, 15);

    // ============================================================
    // ★プレイヤーキャラクター（強化版 + アニメーション対応）★
    // ============================================================
    const playerGroup = new THREE.Group();
    
    // ★アニメーション用パラメータ★
    let walkCycle = 0;
    const WALK_SPEED = 12; // 歩行速度
    let isMovingFlag = false; // ★ウェポンスウェイ用: 移動状態を共有★
    
    // ★射撃モーション用★
    let shootKickback = 0;   // 射撃時の腕のキックバック（0→1→0）
    const SHOOT_KICKBACK_SPEED = 25; // キックバック速度
    let isFiringFlag = false; // ★射撃構え用: FIRE長押し状態★
    
    // ★左腕（武器側）のベース位置★
    const LEFT_ARM_BASE_X = 0.55;
    const RIGHT_ARM_BASE_Z = 0;
    
    // === 胴体（ヒップジョイント）===
    const bodyGeo = new THREE.CapsuleGeometry(0.4, 1.2, 4, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.6, metalness: 0.3 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.2;
    body.castShadow = true;
    playerGroup.add(body);
    
    // === 頭（首ジョイント）===
    const headGeo = new THREE.SphereGeometry(0.35, 8, 8);
    const headMat = new THREE.MeshStandardMaterial({ color: 0x34495e, roughness: 0.4, metalness: 0.5 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.1;
    head.castShadow = true;
    playerGroup.add(head);
    
    // ビザー（目）
    const visorGeo = new THREE.BoxGeometry(0.5, 0.1, 0.15);
    const visorMat = new THREE.MeshStandardMaterial({ color: 0x3498db, roughness: 0.2, metalness: 0.8 });
    const visor = new THREE.Mesh(visorGeo, visorMat);
    visor.position.set(0, 2.15, 0.25);
    playerGroup.add(visor);
    
    // === 腕（肩ジョイント）===
    const rightArmPivot = new THREE.Group();
    rightArmPivot.position.set(-0.55, 1.6, 0);
    const armGeo = new THREE.CapsuleGeometry(0.1, 0.6, 4, 8);
    const armMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
    
    // 右腕（非武器側）
    const rightArm = new THREE.Mesh(armGeo, armMat);
    rightArm.position.y = -0.3;
    rightArm.castShadow = true;
    rightArmPivot.add(rightArm);
    playerGroup.add(rightArmPivot);
    
    // 左腕（武器を持つ側）
    const leftArmPivot = new THREE.Group();
    leftArmPivot.position.set(0.55, 1.6, 0);
    
    // ★左腕（CapsuleGeometry）- 下方向に伸びる
    const leftArmGeo = new THREE.CapsuleGeometry(0.1, 0.6, 4, 8);
    const leftArmMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
    const leftArmMesh = new THREE.Mesh(leftArmGeo, leftArmMat);
    leftArmMesh.position.y = -0.3; // ピボットから下
    leftArmMesh.castShadow = true;
    leftArmPivot.add(leftArmMesh);
    
    // ★拳銃（持ち手 + 銃身）★ - Glock風デザイン
    const gunGroup = new THREE.Group();
    
    // グリップ（持ち手）- 縦向き、手が握る部分
    const gripGeo = new THREE.BoxGeometry(0.14, 0.38, 0.12);
    const gripMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.7 });
    const grip = new THREE.Mesh(gripGeo, gripMat);
    grip.position.set(0, -0.15, 0); // グリップの中心位置
    gunGroup.add(grip);
    
    // スライド（上面カバー）- グリップに接するように配置（隙間なし）
    const slideGeo = new THREE.BoxGeometry(0.13, 0.12, 0.48);
    const slideMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.3, metalness: 0.8 });
    const slide = new THREE.Mesh(slideGeo, slideMat);
    slide.position.set(0, 0.04, 0.24); // グリップ上端に接する位置
    
    // スライド上面の溝（装飾）- スライド上面に接するように配置
    const grooveGeo = new THREE.BoxGeometry(0.135, 0.01, 0.46);
    const grooveMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.2, metalness: 0.9 });
    const groove = new THREE.Mesh(grooveGeo, grooveMat);
    groove.position.set(0, 0.1, 0.24); // スライド上面に接する位置
    
    gunGroup.add(slide);
    gunGroup.add(groove);
    
    // バレル（銃口）- スライド前面から突き出す
    const barrelGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.12, 8);
    const barrelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.2, metalness: 0.9 });
    const barrel = new THREE.Mesh(barrelGeo, barrelMat);
    barrel.rotation.x = Math.PI / 2; // Z軸方向に向ける
    barrel.position.set(0, 0.04, 0.48); // スライド前面
    
    // マズルフラッシュ用ポイントライト（バレルの先端）
    const muzzleLight = new THREE.PointLight(0xffaa44, 0, 5);
    muzzleLight.position.set(0, 0.04, 0.54); // バレルの先
    gunGroup.add(muzzleLight);
    
    // ★拳銃の初期回転: バレルを水平に★
    gunGroup.rotation.x = Math.PI / 2;
    
    // ★拳銃を左腕メッシュの先端に配置（手が握る位置）★
    gunGroup.position.set(0, -0.15, 0.2); // グリップが手に接する + バレル寄り
    leftArmMesh.add(gunGroup);
    
    playerGroup.add(leftArmPivot);
    
    // === 脚（腰ジョイント）===
    const leftLegPivot = new THREE.Group();
    leftLegPivot.position.set(-0.2, 0.6, 0);
    const legGeo = new THREE.CapsuleGeometry(0.12, 0.7, 4, 8);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x1a252f });
    
    // 左足
    const leftLeg = new THREE.Mesh(legGeo, legMat);
    leftLeg.position.y = -0.35;
    leftLeg.castShadow = true;
    leftLegPivot.add(leftLeg);
    playerGroup.add(leftLegPivot);
    
    // 右足
    const rightLegPivot = new THREE.Group();
    rightLegPivot.position.set(0.2, 0.6, 0);
    const rightLeg = new THREE.Mesh(legGeo, legMat);
    rightLeg.position.y = -0.35;
    rightLeg.castShadow = true;
    rightLegPivot.add(rightLeg);
    playerGroup.add(rightLegPivot);
    
    scene.add(playerGroup);

    // ============================================================
    // ★モンスター敵キャラクター（強化版）★
    // ============================================================
    class MonsterEnemy {
      constructor(pos, type='basic') {
        this.health = type==='basic' ? 50 : 100;
        this.maxHealth = this.health;
        this.speed = type==='basic' ? 3 : 5;
        this.damage = type==='basic' ? 10 : 20;
        this.detectionRange = 20;
        this.attackRange = 3;
        
        const group = new THREE.Group();
        
        // 胴体（不規則な形状）- 岩と同様に半径方向に変形
        const bodyGeo = new THREE.IcosahedronGeometry(0.5, 4);
        const positions = bodyGeo.attributes.position;
        for (let i = 0; i < positions.count; i++) {
          const px = positions.getX(i), py = positions.getY(i), pz = positions.getZ(i);
          
          // 3層のノイズを合成（岩と同様）
          const n1 = Math.sin(px * 2.5 + pz * 1.7) * Math.cos(py * 2.0) * 0.1;
          const n2 = Math.sin(px * 5.0 - py * 3.0) * Math.cos(pz * 4.0) * 0.05;
          const n3 = Math.sin(px * 10.0 + pz * 8.0) * Math.cos(py * 9.0) * 0.02;
          
          // 半径方向に変形（岩と同様）
          const displacement = (n1 + n2 + n3) * 0.5;
          const length = Math.sqrt(px*px + py*py + pz*pz);
          if (length > 0) {
            positions.setXYZ(i, 
              px + (px/length) * displacement,
              py + (py/length) * displacement * 0.7, // Y軸は少し潰す
              pz + (pz/length) * displacement
            );
          }
        }
        bodyGeo.computeVertexNormals();
        
        const color = type==='basic' ? 0xe74c3c : 0x9b59b6;
        const bodyMat = new THREE.MeshStandardMaterial({ 
          color, 
          roughness: 0.8, 
          metalness: 0.2
        });
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        bodyMesh.position.y = 1.2;
        bodyMesh.castShadow = true;
        group.add(bodyMesh);
        
        // 角（Horns）
        if (type === 'basic') {
          for (let side of [-1, 1]) {
            const hornGeo = new THREE.ConeGeometry(0.08, 0.4, 6);
            const hornMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const horn = new THREE.Mesh(hornGeo, hornMat);
            horn.position.set(side * 0.2, 1.9, -0.1);
            horn.rotation.z = side * 0.3;
            group.add(horn);
          }
        }
        
        // 目（前面）
        const eyeGeo = new THREE.SphereGeometry(0.08, 6, 6);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        for (let side of [-1, 1]) {
          const eye = new THREE.Mesh(eyeGeo, eyeMat);
          eye.position.set(side * 0.15, 1.4, 0.35);
          group.add(eye);
        }
        
        // HPバー
        const hpBarGeo = new THREE.PlaneGeometry(1, 0.12);
        const hpBarMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide });
        this.hpBar = new THREE.Mesh(hpBarGeo, hpBarMat);
        this.hpBar.position.y = 2.5;
        group.add(this.hpBar);
        
        group.position.copy(pos);
        scene.add(group);
        this.mesh = group;
        this.state = 'patrol';
        this.attackCooldown = 0;
        
        // ★衝突判定用★
        this.collisionRadius = 0.6;
      }
      
      canSeePlayer() {
        const d = this.mesh.position.distanceTo(playerGroup.position);
        if (d > this.detectionRange) return false;
        const toP = new THREE.Vector3().subVectors(playerGroup.position, this.mesh.position).normalize();
        const fwd = new THREE.Vector3();
        this.mesh.getWorldDirection(fwd);
        fwd.y = 0;
        fwd.normalize();
        return fwd.dot(toP) > 0.5;
      }
      
      update(delta) {
        this.attackCooldown -= delta;
        const d = this.mesh.position.distanceTo(playerGroup.position);
        
        if (this.hpBar) {
          const hpRatio = Math.max(0, this.health / this.maxHealth);
          this.hpBar.scale.x = hpRatio;
          this.hpBar.material.color.setHex(hpRatio > 0.5 ? 0x00ff00 : hpRatio > 0.25 ? 0xffff00 : 0xff0000);
        }
        
        if (this.state === 'patrol' && this.canSeePlayer()) {
          this.state = 'chase';
        } else if (this.state === 'chase') {
          if (!this.canSeePlayer() && d > this.detectionRange*1.5) {
            this.state = 'patrol';
          } else if (d <= this.attackRange) {
            this.state = 'attack';
          } else {
            const dir = new THREE.Vector3().subVectors(playerGroup.position, this.mesh.position).normalize();
            dir.y = 0;
            
            // ★敵の移動先座標★
            const newX = this.mesh.position.x + dir.x * this.speed * delta;
            const newZ = this.mesh.position.z + dir.z * this.speed * delta;
            
            // ★衝突チェック（岩・建物）★
            if (!checkCollision({x: newX, z: newZ}, this.collisionRadius)) {
              this.mesh.position.x = newX;
              this.mesh.position.z = newZ;
            } else {
              // 衝突 → スライディング
              if (!checkCollision({x: newX, z: this.mesh.position.z}, this.collisionRadius)) {
                this.mesh.position.x = newX;
              } else if (!checkCollision({x: this.mesh.position.x, z: newZ}, this.collisionRadius)) {
                this.mesh.position.z = newZ;
              }
            }
            
            this.mesh.lookAt(new THREE.Vector3(playerGroup.position.x, 0, playerGroup.position.z));
          }
        } else if (this.state === 'attack') {
          if (d > this.attackRange*1.5) {
            this.state = 'chase';
          } else if (this.attackCooldown <= 0) {
            STATE.playerHealth -= this.damage;
            updateHPBar();
            this.attackCooldown = 1.5;
            if (STATE.playerHealth <= 0) gameOver();
          }
        }
        
        // 地形追従
        const terrainY = getTerrainHeight(this.mesh.position.x, this.mesh.position.z);
        this.mesh.position.y = terrainY + 0.2;
      }
      
      takeDamage(amount) {
        this.health -= amount;
        this.mesh.children[0].material.emissive.setHex(0xffffff);
        setTimeout(() => this.mesh.children[0].material.emissive.setHex(0x000000), 100);
        
        // ★ダメージを受けたら敵が気づく（patrol→chase）★
        if (this.state === 'patrol') {
          this.state = 'chase';
        }
        
        if (this.health <= 0) {
          scene.remove(this.mesh);
          const i = STATE.enemies.indexOf(this);
          if(i > -1) STATE.enemies.splice(i, 1);
          STATE.score += 100;
          updateScoreDisplay();
          spawnWave(STATE.wave + 1);
        }
      }
    }

    // ============================================================
    // カメラ更新（リコイル回転付き）
    // ============================================================
    function updateCamera(delta) {
      currentZoom += (targetZoom - currentZoom) * 0.1;
      
      const camX = playerGroup.position.x + Math.sin(cameraYaw) * currentZoom;
      const camZ = playerGroup.position.z - Math.cos(cameraYaw) * currentZoom;
      const heightOffset = Math.tan(cameraPitch) * currentZoom;
      const baseCamY = playerGroup.position.y + SPRING_ARM.HEIGHT + heightOffset;
      
      // ★障害物チェックを削除（TPSでは簡潔に）★
      let finalCamPos = new THREE.Vector3(camX, baseCamY, camZ);
      
      camera.position.lerp(finalCamPos, SPRING_ARM.LERP_FACTOR);
      
      // ★リコイル回転をカメラに適用★
      const lookTarget = playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
      camera.lookAt(lookTarget);
      
      // リコイル回転（垂直+水平）— lookAt()の後に追加
      camera.rotateX(-recoilVertical * 0.15); // 上方向スナップ（大きく）
      camera.rotateY(recoilHorizontal * 0.1); // 左右スパッド（大きく）
      
      // カメラリコイル回復（毎フレーム少しずつ戻す）
      recoilVertical *= Math.pow(0.3, delta);
      if (recoilVertical < 0.001) recoilVertical = 0;
    }

    // ============================================================
    // ★衝突判定関数（スフィア + AABB対応）★
    // ============================================================
    const PLAYER_RADIUS = 0.5; // プレイヤーの衝突半径
    
    function checkCollision(pos, radius) {
      for (const obj of obstacles) {
        if (obj.halfWidth !== undefined) {
          // ★建物（AABB）: Circle vs AABBアルゴリズム★
          const halfW = obj.halfWidth;
          const boxX = obj.position.x;
          const boxZ = obj.position.z;
          
          // AABB内部で円に最も近い点
          const closestX = Math.max(boxX - halfW, Math.min(pos.x, boxX + halfW));
          const closestZ = Math.max(boxZ - halfW, Math.min(pos.z, boxZ + halfW));
          
          // 円の中心からその点までの距離
          const dx = pos.x - closestX;
          const dz = pos.z - closestZ;
          
          if (dx*dx + dz*dz < radius * radius) {
            return true; // 衝突
          }
        } else {
          // ★岩・敵（スフィア）: 距離二乗比較★
          const dx = pos.x - obj.position.x;
          const dz = pos.z - obj.position.z;
          if (dx*dx + dz*dz < (radius + obj.collisionRadius)**2) {
            return true; // 衝突
          }
        }
      }
      return false; // 安全
    }

    // ============================================================
    // プレイヤー移動（地形追従付き）— 腕は別関数で管理
    // ============================================================
    let playerRotationTarget = 0;
    const ROTATION_SPEED = 30;
    
    function updatePlayer(delta) {
      const speed = 6;
      
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();
      
      const right = new THREE.Vector3();
      right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
      
      const moveDir = new THREE.Vector3();
      if (joystickInput.forward) moveDir.add(forward);
      if (joystickInput.back) moveDir.sub(forward);
      if (joystickInput.right) moveDir.add(right);
      if (joystickInput.left) moveDir.sub(right);
      
      const isMoving = moveDir.length() > 0;
      
      // ★ウェポンスウェイ用に移動状態を共有★
      isMovingFlag = isMoving;
      
      if (isMoving) {
        moveDir.normalize();
        
        // 移動先の座標を計算
        const newX = playerGroup.position.x + moveDir.x * speed * delta;
        const newZ = playerGroup.position.z + moveDir.z * speed * delta;
        
        // ★衝突チェック★
        if (!checkCollision({x: newX, z: newZ}, PLAYER_RADIUS)) {
          // 安全 → 移動
          playerGroup.position.x = newX;
          playerGroup.position.z = newZ;
        } else {
          // 衝突 → スライディング（XまたはZのみ）
          if (!checkCollision({x: newX, z: playerGroup.position.z}, PLAYER_RADIUS)) {
            playerGroup.position.x = newX;
          } else if (!checkCollision({x: playerGroup.position.x, z: newZ}, PLAYER_RADIUS)) {
            playerGroup.position.z = newZ;
          }
        }
        
        // ★滑らかに回転（lerpで微細な角度調整に対応）★
        const targetAngle = Math.atan2(moveDir.x, moveDir.z);
        let angleDiff = targetAngle - playerRotationTarget;
        if (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        if (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        
        // lerpで毎フレーム8%ずつ目標角度に近づける（より細かい角度調整）
        const lerpFactor = 0.08;
        playerRotationTarget += angleDiff * lerpFactor;
        playerGroup.rotation.y = playerRotationTarget;
      }
      
      // ★地形追従★
      const terrainY = getTerrainHeight(playerGroup.position.x, playerGroup.position.z);
      playerGroup.position.y = terrainY + 0.2;
      
      // ★脚アニメーション（移動中のみ）★
      if (isMoving) {
        walkCycle += delta * WALK_SPEED;
        
        // 歩行アニメーション（正弦波で足を振る）
        const swingAngle = Math.sin(walkCycle) * 0.5; // 最大28度
        
        // 左足・右足（交互に振る）
        leftLegPivot.rotation.x = swingAngle;
        rightLegPivot.rotation.x = -swingAngle;
        
        // ボディの上下動（歩行時のバウンド）
        body.position.y = 1.2 + Math.abs(Math.sin(walkCycle)) * 0.05;
      } else {
        // 停止時は元の位置に戻す（滑らかに）
        walkCycle *= 0.9; // 減衰
        
        leftLegPivot.rotation.x *= 0.9;
        rightLegPivot.rotation.x *= 0.9;
        
        body.position.y += (1.2 - body.position.y) * 0.1;
      }
    }
    
    // ============================================================
    // ★腕アニメーション統合（歩行 + ADS + 射撃構え + キックバック + スウェイ）★
    // ============================================================
    function updateArmAnimation(delta, camDir) {
      const isMoving = isMovingFlag;
      
      // --- 歩行スイング ---
      const walkSwing = isMoving ? Math.sin(walkCycle) * 0.5 : 0;
      
      // --- ADS構え方（ズーム用）---
      const armExtend = currentAimBlend * 0.3;
      
      // --- 射撃キックバック（毎フレーム更新）---
      if (shootKickback > 0) {
        shootKickback -= SHOOT_KICKBACK_SPEED * delta;
        if (shootKickback < 0) shootKickback = 0;
      }
      
      // --- ウェポンスウェイ ---
      swayTime += delta;
      const isMovingNow = joystickInput.forward || joystickInput.back || joystickInput.left || joystickInput.right;
      const moveFactor = isMovingNow ? 1.0 : 0.0;
      
      const swayX = (Math.sin(swayTime * 1.3) * 0.5 + Math.sin(swayTime * 0.7) * 0.5);
      const swayY = (Math.cos(swayTime * 1.1) * 0.5 + Math.cos(swayTime * 0.9) * 0.5);
      
      let strength;
      if (currentAimBlend > 0.7) {
        strength = SWAY_AIM_STRENGTH;
      } else if (moveFactor > 0) {
        strength = SWAY_MOVE_STRENGTH;
      } else {
        strength = SWAY_IDLE_STRENGTH;
      }
      
      // --- ★左腕（武器側）---
      const aimAngleTarget = 0; // カメラ視点に関係なく固定
      
      // ★射撃構え: FIRE長押しで肩ピボットを回転（position.zはADS時のみ）★
      const firingStanceTarget = isFiringFlag ? 1.0 : 0.0;
      
      leftArmPivot.rotation.x = walkSwing - aimAngleTarget + swayY * strength 
        - shootKickback * 0.5 - firingStanceTarget * 1.5; // 前に上げる（符号反転）
      leftArmPivot.rotation.z = -swayX * strength * 0.5;
      
      // ★positionは固定（ADS時のみX座標変更）★
      leftArmPivot.position.x = LEFT_ARM_BASE_X + armExtend * Math.cos(cameraYaw);
      leftArmPivot.position.y = 1.6;
      leftArmPivot.position.z = 0; // カメラ回転に関係なく固定
      
      // ★タッチパッドで腕の回転を変更 → 拳銃と弾丸が自動追従★
      const aimRotX = aimOffsetY * 0.5; // 上下（タッチパッドY）
      const aimRotZ = -aimOffsetX * 0.3; // 左右（タッチパッドX）
      
      leftArmPivot.rotation.x += aimRotX;
      leftArmPivot.rotation.z += aimRotZ;
      if (isMoving) {
        rightArmPivot.rotation.x = -walkSwing * 0.8 + swayY * strength * 0.3;
      } else {
        rightArmPivot.rotation.x *= 0.9;
        rightArmPivot.rotation.z = swayX * strength * 0.2;
      }
      
      // ★右腕position: 毎フレームベース位置に戻す（累積しない）★
      rightArmPivot.position.x += (-0.55 - rightArmPivot.position.x) * 3 * delta;
    }

    // ============================================================
    // ジョイスティック
    // ============================================================
    const joystickManager = nipplejs.create({
      zone: document.getElementById('joystick-zone'), mode: 'static',
      position: { left: '50%', top: '50%' }, color: 'white', size: 120,
    });

    joystickManager.on('move', (evt, data) => {
      if (!data?.vector) return;
      const threshold = 0.3;
      joystickInput.x = data.vector.x;
      joystickInput.y = data.vector.y;
      joystickInput.forward = data.vector.y > threshold;
      joystickInput.back = data.vector.y < -threshold;
      joystickInput.right = data.vector.x > threshold;
      joystickInput.left = data.vector.x < -threshold;
    });

    joystickManager.on('end', () => {
      Object.assign(joystickInput, { x:0, y:0, forward:false, back:false, left:false, right:false });
    });

    // ============================================================
    // カメラ回転
    // ============================================================
    const TOUCH_SENSITIVITY = 0.005;
    let lastTouchX = 0, lastTouchY = 0;

    canvas.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      if (touch.clientX > window.innerWidth / 2) {
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      if (touch.clientX > window.innerWidth / 2) {
        const dx = touch.clientX - lastTouchX;
        const dy = touch.clientY - lastTouchY;
        
        cameraYaw -= dx * TOUCH_SENSITIVITY;
        cameraPitch = Math.max(SPRING_ARM.MIN_PITCH, Math.min(SPRING_ARM.MAX_PITCH, cameraPitch - dy * TOUCH_SENSITIVITY));
        
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
      }
    }, { passive: true });

    // ============================================================
    // 射撃システム（ADS + リコイル可視化 + ウェポンスウェイ）
    // ============================================================
    const WEAPON = { AMMO_MAX: 30, AMMO_CURRENT: 30, FIRE_RATE: 0.15, RECOIL_AMOUNT: 0.08, RECOVERY_SPEED: 4.0, RELOAD_TIME: 2.0 };
    
    // ★リコイル状態★
    let recoilVertical = 0;     // 垂直リコイル（上方向）
    let recoilHorizontal = 0;   // 水平スパッド
    let recoilRecovery = 0;     // リコイル回復量
    
    // ★ADS状態★
    let currentAimBlend = 0;    // 0=HipFire, 1=ADS
    const ADS_ZOOM_FACTOR = 0.55; // ADS時のズーム倍率（0.55 = 45%縮小）
    
    // ★ウェポンスウェイ★
    let swayTime = 0;
    const SWAY_IDLE_STRENGTH = 0.015;
    const SWAY_MOVE_STRENGTH = 0.025;
    const SWAY_AIM_STRENGTH = 0.008;
    
    // ★リロード状態★
    let isReloading = false;
    let reloadProgress = 0;     // 0→1
    let gunReloadRotation = 0;  // リロード時の銃回転
    
    let lastFireTime = 0;

    const hitEffects = [], muzzleFlashes = [], tracers = [];
    
    // ★ADS切替（右クリック/COVERボタン）★
    function toggleAim() {
      if (isReloading) return;
      SHOOT_STATE.isAiming = !SHOOT_STATE.isAiming;
    }
    
    // ★射撃処理★
    function shoot() {
      if (isReloading || WEAPON.AMMO_CURRENT <= 0) return;
      
      const now = performance.now() / 1000;
      if (now - lastFireTime < WEAPON.FIRE_RATE) return;
      lastFireTime = now;
      
      WEAPON.AMMO_CURRENT--;
      updateAmmoDisplay();
      
      // ★リコイル適用★
      recoilVertical += WEAPON.RECOIL_AMOUNT * (0.8 + Math.random() * 0.4); // ランダム性
      recoilHorizontal += (Math.random() - 0.5) * WEAPON.RECOIL_AMOUNT * 0.6;
      
      // ★腕のキックバック（射撃モーション）★
      shootKickback = 1.0;
      
      // ★マズルフラッシュ（ライト点灯）★
      muzzleLight.intensity = 8;
      
      // ★銃のワールド方向を取得してレイキャスト（バレルの真正面）★
      const gunWorldDir = new THREE.Vector3(0, 0, 1); // +Z方向がバレルの向き
      
      gunWorldDir.applyQuaternion(gunGroup.getWorldQuaternion(new THREE.Quaternion()));
      
      // ADS時は少し補正（照準中央に合わせる）
      if (currentAimBlend > 0.5) {
        gunWorldDir.y += 0.02; // 照準をわずかに上げる
      }
      gunWorldDir.normalize();
      
      // ★弾発射位置: バレルの先端（マズルフラッシュの位置）★
      const gunWorldPos = new THREE.Vector3(0, 0.25, 0.71); // バレル先端のローカル座標
      gunWorldPos.applyMatrix4(gunGroup.matrixWorld);
      
      const raycaster = new THREE.Raycaster(gunWorldPos, gunWorldDir, 0, 100);
      const enemyMeshes = STATE.enemies.map(e => e.mesh);
      const intersects = raycaster.intersectObjects(enemyMeshes, true);
      
      if (intersects.length > 0 && intersects[0].distance < 100) {
        const hitObject = intersects[0].object;
        let enemy = STATE.enemies.find(e => e.mesh === hitObject || e.mesh.children.includes(hitObject));
        if (enemy) {
          enemy.takeDamage(25);
          createHitEffect(intersects[0].point);
          showHitMarker();
        }
      }
      
      // マズルフラッシュ（シーン用）
      createMuzzleFlash(gunWorldPos, gunWorldDir);
      
      // トレーサー
      const target = intersects.length > 0 ? intersects[0].point : gunWorldPos.clone().add(gunWorldDir.clone().multiplyScalar(50));
      createTracer(gunWorldPos, target);
    }
    
    // ★リコイル更新（毎フレーム）★
    function updateRecoil(delta) {
      // 垂直リコイル回復
      if (recoilVertical > 0) {
        recoilVertical -= WEAPON.RECOVERY_SPEED * delta;
        if (recoilVertical < 0) recoilVertical = 0;
      }
      
      // 水平スパッド減衰（速く戻る）
      if (recoilHorizontal !== 0) {
        recoilHorizontal *= Math.pow(0.1, delta); // 指数関数的減衰
        if (Math.abs(recoilHorizontal) < 0.001) recoilHorizontal = 0;
      }
      
      // マズルフラッシュ減衰（速く消える）
      muzzleLight.intensity *= Math.pow(0.001, delta);
    }
    
    // ★ADSブレンド更新★
    function updateAimBlend(delta) {
      const targetBlend = SHOOT_STATE.isAiming ? 1 : 0;
      const speed = SHOOT_STATE.aimSpeed * (SHOOT_STATE.isAiming ? 1.5 : 2.0); // ADS時は少し遅く、解除は速く
      
      currentAimBlend += (targetBlend - currentAimBlend) * Math.min(1, speed * delta);
      
      // ズーム補間（ADS時はズームイン）
      targetZoom = SPRING_ARM.DISTANCE * (1.0 - ADS_ZOOM_FACTOR * currentAimBlend);
    }
    
    // ★リロードアニメーション★
    function updateReloadAnimation(delta) {
      if (!isReloading) return;
      
      reloadProgress += delta / WEAPON.RELOAD_TIME;
      
      if (reloadProgress >= 1) {
        WEAPON.AMMO_CURRENT = WEAPON.AMMO_MAX;
        isReloading = false;
        reloadProgress = 0;
        gunReloadRotation = 0;
        updateAmmoDisplay();
        return;
      }
      
      // リロード時の銃の回転アニメーション（0→1→0）
      if (reloadProgress < 0.5) {
        // 前半: 銃を下げる
        gunReloadRotation = Math.sin(reloadProgress * Math.PI) * -1.2;
      } else {
        // 後半: 銃を元に戻す
        const t = (reloadProgress - 0.5) * 2;
        gunReloadRotation = Math.sin(t * Math.PI) * -1.2;
      }
      
      // ★初期回転(PI/2)にリロード回転を追加★
      gunGroup.rotation.x = Math.PI / 2 + gunReloadRotation;
    }
    
    function createHitEffect(position) {
      const particleCount = 8;
      const positions = new Float32Array(particleCount * 3);
      const velocities = [];
      
      for (let i = 0; i < particleCount; i++) {
        positions[i*3] = position.x;
        positions[i*3+1] = position.y;
        positions[i*3+2] = position.z;
        
        velocities.push(new THREE.Vector3(
          (Math.random() - 0.5) * 4,
          Math.random() * 4,
          (Math.random() - 0.5) * 4
        ));
      }
      
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      
      const mat = new THREE.PointsMaterial({ size: 0.2, color: 0xffaa44, transparent: true, opacity: 1 });
      const particles = new THREE.Points(geo, mat);
      scene.add(particles);
      
      hitEffects.push({ mesh: particles, velocities, life: 0.3, maxLife: 0.3 });
    }

    function createMuzzleFlash(position, direction) {
      const flash = new THREE.PointLight(0xffaa44, 10, 8);
      flash.position.copy(position);
      if (direction) flash.position.addScaledVector(direction, -1);
      scene.add(flash);
      
      muzzleFlashes.push({ light: flash, life: 0.05 });
    }

    function createTracer(startPos, target) {
      const points = [startPos.clone(), target];
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      
      const mat = new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 3, transparent: true, opacity: 1.0 });
      const line = new THREE.Line(geo, mat);
      
      const coreGeo = new THREE.BufferGeometry().setFromPoints(points);
      const coreMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
      const coreLine = new THREE.Line(coreGeo, coreMat);
      
      scene.add(line);
      scene.add(coreLine);
      
      tracers.push({ line, coreLine, life: 0.15, maxLife: 0.15 });
    }

    function showHitMarker() {
      const hitMarker = document.getElementById('hit-marker');
      hitMarker.style.opacity = '1';
      setTimeout(() => { hitMarker.style.opacity = '0'; }, 100);
    }

    function reload() {
      if (isReloading || WEAPON.AMMO_CURRENT === WEAPON.AMMO_MAX) return;
      isReloading = true;
      reloadProgress = 0;
      
      const ammoDisplay = document.getElementById('ammo-display');
      ammoDisplay.textContent = 'RELOADING...';
      ammoDisplay.style.color = '#ffaa00';
    }

    function updateAmmoDisplay() {
      const ammoDisplay = document.getElementById('ammo-display');
      if (!isReloading) {
        ammoDisplay.textContent = `${WEAPON.AMMO_CURRENT} / ${WEAPON.AMMO_MAX}`;
        ammoDisplay.style.color = WEAPON.AMMO_CURRENT <= 5 ? '#ff4444' : 'white';
      }
    }

    // ============================================================
    // ウェーブ生成
    // ============================================================
    function spawnWave(waveNum) {
      STATE.wave = waveNum;
      
      const waveDisplay = document.getElementById('wave-display');
      waveDisplay.textContent = `WAVE ${waveNum}`;
      waveDisplay.style.opacity = '1';
      setTimeout(() => { waveDisplay.style.opacity = '0'; }, 2000);
      
      const enemyCount = Math.min(waveNum + 2, 8);
      for (let i = 0; i < enemyCount; i++) {
        const angle = (i / enemyCount) * Math.PI * 2;
        const distance = 15 + Math.random() * 10;
        const x = Math.cos(angle) * distance;
        const z = Math.sin(angle) * distance;
        
        const type = waveNum >= 3 && Math.random() > 0.7 ? 'strong' : 'basic';
        const enemy = new MonsterEnemy(new THREE.Vector3(x, 0, z), type);
        STATE.enemies.push(enemy);
      }
    }

    function updateHPBar() {
      const hpFill = document.getElementById('hp-fill');
      const healthRatio = Math.max(0, STATE.playerHealth / STATE.maxHealth);
      hpFill.style.width = (healthRatio * 100) + '%';
      
      if (healthRatio < 0.3) {
        hpFill.style.background = '#ff0000';
      } else {
        hpFill.style.background = 'linear-gradient(to right, #e74c3c, #ff6b6b)';
      }
    }

    function updateScoreDisplay() {
      document.getElementById('score-display').textContent = `Score: ${STATE.score}`;
    }

    // ============================================================
    // ボタン操作
    // ============================================================
    let isFiring = false;
    
    // ★FIREボタン: タッチパッド機能（照準微調整）★
    let firePadActive = false;
    let firePadStartX = 0, firePadStartY = 0;
    let aimOffsetX = 0, aimOffsetY = 0; // 照準オフセット（-1〜1）
    const AIM_PAD_SENSITIVITY = 0.02; // タッチパッド感度
    
    const fireBtn = document.getElementById('fire-btn');
    
    fireBtn.addEventListener('pointerdown', (e) => { 
      e.preventDefault(); 
      isFiring = true; 
      isFiringFlag = true; 
      shoot();
      
      // 初期タッチ位置を記録（タッチパッド開始）
      const rect = fireBtn.getBoundingClientRect();
      firePadStartX = e.clientX - rect.left;
      firePadStartY = e.clientY - rect.top;
      firePadActive = true;
    }, { passive: false });
    
    // タッチパッド移動（ボタン内でのドラッグ）
    fireBtn.addEventListener('pointermove', (e) => { 
      if (!firePadActive) return;
      e.preventDefault();
      
      const rect = fireBtn.getBoundingClientRect();
      const dx = (e.clientX - rect.left) - firePadStartX;
      const dy = (e.clientY - rect.top) - firePadStartY;
      
      // 感度をかけて-1〜1の範囲に制限
      aimOffsetX = Math.max(-1, Math.min(1, dx * AIM_PAD_SENSITIVITY));
      aimOffsetY = Math.max(-1, Math.min(1, dy * AIM_PAD_SENSITIVITY));
    }, { passive: false });
    
    fireBtn.addEventListener('pointerup', (e) => { 
      e.preventDefault();
      isFiring = false; 
      isFiringFlag = false; 
      firePadActive = false;
      
      // タッチ離れでオフセットリセット（少し遅延）
      setTimeout(() => { aimOffsetX = 0; aimOffsetY = 0; }, 200);
    });
    
    fireBtn.addEventListener('pointerleave', () => { 
      firePadActive = false;
      aimOffsetX = 0; aimOffsetY = 0;
    });
    
    setInterval(() => {
      if (isFiring && STATE.isPlaying && !STATE.isGameOver) shoot();
    }, 100);
    
    document.getElementById('reload-btn').addEventListener('click', reload);
    
    // ★COVERボタン = ADS切替★
    const coverBtn = document.getElementById('cover-btn');
    coverBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); toggleAim(); });

    // ============================================================
    // レスポンシブ対応
    // ============================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================
    // FPSモニター
    // ============================================================
    let frameCount = 0, lastTime = performance.now();
    const fpsDisplay = document.getElementById('fps-display');
    
    function checkFPS() {
      const now = performance.now();
      frameCount++;
      if (now - lastTime >= 1000) {
        fpsDisplay.textContent = `FPS: ${frameCount}`;
        frameCount = 0;
        lastTime = now;
      }
    }

    // ============================================================
    // ゲームループ
    // ============================================================
    const clock = new THREE.Clock();
    
    function gameLoop() {
      if (!STATE.isPlaying || STATE.isGameOver) return;
      
      const delta = Math.min(clock.getDelta(), 0.1);
      
      // ★カメラの真正面ベクトル（腕アニメーション用）★
      const camForward = new THREE.Vector3();
      camera.getWorldDirection(camForward);
      
      updatePlayer(delta);
      updateAimBlend(delta);
      updateArmAnimation(delta, camForward); // 腕アニメーション統合関数
      updateRecoil(delta);
      updateReloadAnimation(delta);
      updateCamera(delta); // リコイル適用済みで呼び出し
      
      for (const enemy of STATE.enemies) enemy.update(delta);
      
      // ヒットエフェクトの更新
      for (let i = hitEffects.length - 1; i >= 0; i--) {
        const effect = hitEffects[i];
        effect.life -= delta;
        
        if (effect.life <= 0) {
          scene.remove(effect.mesh);
          hitEffects.splice(i, 1);
          continue;
        }
        
        const positions = effect.mesh.geometry.attributes.position.array;
        for (let j = 0; j < effect.velocities.length; j++) {
          positions[j*3] += effect.velocities[j].x * delta;
          positions[j*3+1] += effect.velocities[j].y * delta;
          positions[j*3+2] += effect.velocities[j].z * delta;
          effect.velocities[j].y -= 9.8 * delta;
        }
        effect.mesh.geometry.attributes.position.needsUpdate = true;
        effect.mesh.material.opacity = effect.life / effect.maxLife;
      }
      
      // マズルフラッシュの更新
      for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
        const flash = muzzleFlashes[i];
        flash.life -= delta;
        
        if (flash.life <= 0) {
          scene.remove(flash.light);
          muzzleFlashes.splice(i, 1);
        } else {
          flash.light.intensity = flash.life / 0.05 * 10;
        }
      }
      
      // トレーサーの更新
      for (let i = tracers.length - 1; i >= 0; i--) {
        const tracer = tracers[i];
        tracer.life -= delta;
        
        if (tracer.life <= 0) {
          scene.remove(tracer.line);
          scene.remove(tracer.coreLine);
          tracers.splice(i, 1);
        } else {
          tracer.line.material.opacity = tracer.life / tracer.maxLife;
          tracer.coreLine.material.opacity = (tracer.life / tracer.maxLife) * 0.8;
        }
      }
      
      checkFPS();
      renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // スタート/リスタート処理
    // ============================================================
    function startGame() {
      STATE.isPlaying = true;
      STATE.isGameOver = false;
      STATE.playerHealth = 100;
      STATE.score = 0;
      STATE.wave = 1;
      STATE.enemies = [];
      
      WEAPON.AMMO_CURRENT = WEAPON.AMMO_MAX;
      isReloading = false;
      
      playerGroup.position.set(0, getTerrainHeight(0, 0) + 0.2, 0);
      cameraYaw = 0;
      cameraPitch = 0;
      
      for (const enemy of STATE.enemies) scene.remove(enemy.mesh);
      
      updateHPBar();
      updateScoreDisplay();
      updateAmmoDisplay();
      
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
      
      clock.start();
      spawnWave(1);
      gameLoop();
    }

    function gameOver() {
      STATE.isGameOver = true;
      document.getElementById('final-score').textContent = `Score: ${STATE.score}`;
      document.getElementById('final-wave').textContent = STATE.wave;
      document.getElementById('enemies-defeated').textContent = Math.floor(STATE.score / 100);
      document.getElementById('game-over-screen').style.display = 'flex';
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    console.log('✅ Browser TPS Phase 4 Enhanced loaded!');
    console.log('🌍 Procedural Terrain + PBR Characters + Monsters');
  </script>
</body>
</html>
